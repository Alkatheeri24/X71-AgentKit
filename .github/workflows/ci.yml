name: X71 AgentKit CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: x71-agentkit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Syntax check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Package dry run
        run: npm run pack:check
      - name: Install and CLI smoke test
        run: |
          npm install -g .
          x71-agentkit --help
