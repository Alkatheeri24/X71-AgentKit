name: X71 AgentKit CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: x71-agentkit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Doctor and scanner smoke tests
        run: |
          node src/cli.mjs doctor . --format markdown --fail-on never
          node src/cli.mjs scan . --format markdown --fail-on never
      - name: Package dry run
        run: npm run pack:check
      - name: Install and CLI smoke test
        run: |
          npm install -g .
          x71-agentkit --help
          x71-agentkit doctor . --format json --fail-on never
      - name: Reusable action smoke test
        uses: ./
        with:
          path: .
          fail-on: never
