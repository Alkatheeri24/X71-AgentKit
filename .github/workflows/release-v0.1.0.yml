name: X71 AgentKit Release

on:
  workflow_run:
    workflows: ["X71 AgentKit CI"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: x71-agentkit-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Read package version
        id: version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid package version: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Create GitHub release if absent
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists; nothing to do."
            exit 0
          fi
          gh release create "$TAG" \
            --target "${{ github.event.workflow_run.head_sha }}" \
            --title "X71 AgentKit v$VERSION" \
            --notes-file CHANGELOG.md
